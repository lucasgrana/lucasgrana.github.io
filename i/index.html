<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocem</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7fb; --card: #fff; --text: #1c1b2e; --muted: #5d5b73; --accent: #3f3d8f; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14131f; --card: #211f33; --text: #eeedf7; --muted: #b0aec6; --accent: #b9b7ff; --on-accent: #1c1b2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 400px; background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
  #code { font: 600 26px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; margin: 0 0 20px; color: var(--text); overflow-wrap: anywhere; }
  a, button { display: block; width: 100%; padding: 14px; border-radius: 12px; font: 600 16px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  a { background: var(--accent); color: var(--on-accent); border: 0; margin-bottom: 10px; }
  button { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Vocem</h1>
  <p id="intro"></p>
  <div id="invite" hidden>
    <div id="code"></div>
    <a id="play" rel="noopener"></a>
    <button id="copy" type="button"></button>
    <p id="ios" style="margin:20px 0 0;font-size:14px"></p>
  </div>
</main>
<script>
  var es = !/^en/i.test(navigator.language || "");
  var t = es ? {
    intro: "Te invitaron a un coro. Instalá la app y usá este código:",
    invalid: "Este link de invitación no es válido. Pedile uno nuevo a tu director.",
    play: "Instalar desde Google Play",
    copy: "Copiar código",
    copied: "Código copiado",
    ios: "En iPhone, copiá el código y pegalo en la app al registrarte."
  } : {
    intro: "You've been invited to a choir. Install the app and use this code:",
    invalid: "This invitation link isn't valid. Ask your director for a new one.",
    play: "Get it on Google Play",
    copy: "Copy code",
    copied: "Code copied",
    ios: "On iPhone, copy the code and paste it in the app when you sign up."
  };
  document.documentElement.lang = es ? "es" : "en";
  var raw = new URLSearchParams(location.search).get("t") || "";
  var code = raw.toUpperCase().replace(/[\s-]/g, "");
  var intro = document.getElementById("intro");
  if (!/^[0-9A-Z]{10}$/.test(code)) {
    intro.textContent = t.invalid;
  } else {
    intro.textContent = t.intro;
    document.getElementById("invite").hidden = false;
    document.getElementById("code").textContent = code.slice(0, 5) + "-" + code.slice(5);
    var play = document.getElementById("play");
    play.textContent = t.play;
    play.href = "https://play.google.com/store/apps/details?id=app.vocem&referrer=" + encodeURIComponent("invite=" + code);
    document.getElementById("ios").textContent = t.ios;
    var copy = document.getElementById("copy");
    copy.textContent = t.copy;
    copy.onclick = function () {
      navigator.clipboard.writeText(code).then(function () { copy.textContent = t.copied; });
    };
  }
</script>
</body>
</html>
